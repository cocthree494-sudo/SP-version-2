name: support-agent-production

x-api-image: &api-image
  image: support-agent-api:${SUPPORT_AGENT_IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: apps/api/Dockerfile

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: ${APP_DATABASE_URL:?Set restricted APP_DATABASE_URL}
  ADMIN_REPORTING_DATABASE_URL: ${ADMIN_REPORTING_DATABASE_URL:?Set restricted ADMIN_REPORTING_DATABASE_URL}
  REDIS_URL: ${REDIS_URL:?Set password-protected REDIS_URL}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set a random 32+ character AUTH_JWT_SECRET}
  AUTH_OTP_SECRET: ${AUTH_OTP_SECRET:?Set AUTH_OTP_SECRET}
  AUTH_OTP_TEST_CODE: ${AUTH_OTP_TEST_CODE:-}
  AUTH_OTP_TTL_SECONDS: ${AUTH_OTP_TTL_SECONDS:-600}
  AUTH_OTP_RESEND_COOLDOWN_SECONDS: ${AUTH_OTP_RESEND_COOLDOWN_SECONDS:-60}
  AUTH_OTP_MAX_ATTEMPTS: ${AUTH_OTP_MAX_ATTEMPTS:-5}
  AUTH_OTP_EMAIL_RATE_LIMIT: ${AUTH_OTP_EMAIL_RATE_LIMIT:-5}
  AUTH_OTP_EMAIL_RATE_WINDOW_SECONDS: ${AUTH_OTP_EMAIL_RATE_WINDOW_SECONDS:-3600}
  AUTH_OTP_IP_RATE_LIMIT: ${AUTH_OTP_IP_RATE_LIMIT:-20}
  AUTH_OTP_IP_RATE_WINDOW_SECONDS: ${AUTH_OTP_IP_RATE_WINDOW_SECONDS:-3600}
  PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
  PLATFORM_ADMIN_OTP_EMAIL: ${PLATFORM_ADMIN_OTP_EMAIL:-namikazeminato11318@gmail.com}
  ADMIN_SESSION_MAX_AGE_SECONDS: ${ADMIN_SESSION_MAX_AGE_SECONDS:-900}
  AUTH_EMAIL_PROVIDER: ${AUTH_EMAIL_PROVIDER:-smtp}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Relay}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
  OAUTH_WEB_BASE_URL: ${OAUTH_WEB_BASE_URL:-}
  OAUTH_ADMIN_WEB_BASE_URL: ${OAUTH_ADMIN_WEB_BASE_URL:-}
  OAUTH_STATE_TTL_SECONDS: ${OAUTH_STATE_TTL_SECONDS:-600}
  OAUTH_HTTP_TIMEOUT_SECONDS: ${OAUTH_HTTP_TIMEOUT_SECONDS:-10}
  OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
  OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
  OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
  OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
  OAUTH_MICROSOFT_TENANT_ID: ${OAUTH_MICROSOFT_TENANT_ID:-common}
  OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
  OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
  BYOK_MASTER_KEY: ${BYOK_MASTER_KEY:-}
  BYOK_MASTER_KEY_VERSION: ${BYOK_MASTER_KEY_VERSION:-kms-v1}
  AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-deterministic}
  AI_PROVIDER_ID: ${AI_PROVIDER_ID:-deterministic}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  LLM_MODEL_ID: ${LLM_MODEL_ID:-deterministic-chat-v1}
  LLM_STRONG_MODEL_ID: ${LLM_STRONG_MODEL_ID:-}
  DETERMINISTIC_LLM_RESPONSE: ${DETERMINISTIC_LLM_RESPONSE:-Deterministic support response.}
  EMBEDDING_PROVIDER_ID: ${EMBEDDING_PROVIDER_ID:-deterministic}
  EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-deterministic-embedding-v1}
  # Embeddings are configured separately from generation. Leaving
  # EMBEDDING_PROVIDER_MODE unset follows AI_PROVIDER_MODE. These must stay in
  # sync with EMBEDDING_PROVIDER_ID/EMBEDDING_MODEL_ID: a provider label without
  # its matching mode would store deterministic hash vectors under a real
  # provider name, which retrieval and re-embedding would then trust.
  EMBEDDING_PROVIDER_MODE: ${EMBEDDING_PROVIDER_MODE:-}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-32}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  VOICE_AGENTS_ENABLED: ${VOICE_AGENTS_ENABLED:-false}
  LOCAL_STORAGE_ROOT: /srv/api/.data/uploads

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set migration-owner POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set migration-owner POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    networks: [backend]

  migrate:
    <<: *api-image
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set migration-owner MIGRATION_DATABASE_URL}
      APP_DATABASE_URL: ${APP_DATABASE_URL:?Set restricted APP_DATABASE_URL}
      ADMIN_REPORTING_DATABASE_URL: ${ADMIN_REPORTING_DATABASE_URL:?Set restricted ADMIN_REPORTING_DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET}
      AUTH_OTP_SECRET: ${AUTH_OTP_SECRET:?Set AUTH_OTP_SECRET}
    command: ["sh", "-c", "alembic upgrade head && python configure_runtime_role.py"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  api:
    <<: *api-image
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - uploads:/srv/api/.data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:${API_PUBLIC_PORT:-8000}:8000"
    networks: [backend, edge]

  worker:
    <<: *api-image
    restart: unless-stopped
    environment: *app-environment
    command: ["arq", "app.workers.ingestion.WorkerSettings"]
    volumes:
      - uploads:/srv/api/.data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'arq' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend, edge]

  web:
    image: support-agent-web:${SUPPORT_AGENT_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL}
        NEXT_PUBLIC_WIDGET_LOADER_URL: ${PUBLIC_WIDGET_LOADER_URL:?Set PUBLIC_WIDGET_LOADER_URL}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      DASHBOARD_PROXY_MAX_BODY_BYTES: ${DASHBOARD_PROXY_MAX_BODY_BYTES:-25165824}
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:${WEB_PUBLIC_PORT:-3000}:3000"
    networks: [edge]

  widget:
    image: support-agent-widget:${SUPPORT_AGENT_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: packages/widget/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WIDGET_PUBLIC_PORT:-8080}:8080"
    networks: [edge]

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres_data:
  redis_data:
  uploads:
