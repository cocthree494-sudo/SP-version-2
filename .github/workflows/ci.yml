name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://support_agent:ci_only@127.0.0.1:5432/support_agent_test
      REDIS_URL: redis://127.0.0.1:6379/15
      AUTH_JWT_SECRET: ci-only-auth-secret-not-used-outside-tests
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Sync Python dependencies
        run: uv sync --project apps/api
        
      - name: Check code (Lint, Typecheck, Test)
        run: npm run check
