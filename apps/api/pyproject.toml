[project]
name = "support-agent-api"
version = "0.1.0"
description = "FastAPI backend for the Support Agent SaaS"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "arq>=0.26,<1.0",
  "asgi-correlation-id>=5.0.1",
  "asyncpg>=0.31.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "pgvector>=0.4,<1.0",
  "pyjwt>=2.10,<3.0",
  "pydantic-settings>=2.14.2",
  "pypdf>=6.0,<7.0",
  "python-docx>=1.2,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "redis>=5.2,<6.0",
  "sqlalchemy>=2.0.51",
  "structlog>=26.1.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1.0",
  "ruff>=0.11,<1.0",
  "mypy>=1.15,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
]

# ── Ruff ────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "S",    # flake8-bandit (security)
  "T20",  # flake8-print
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── mypy ────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ── pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
]
